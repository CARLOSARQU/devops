version: 0.1

android_test_host: amazon_linux_2

phases:
  install:
    commands:
      - devicefarm-cli use node 20
      # Intentar Appium 3 via CLI; si falla, instalar via npm
      - devicefarm-cli use appium 3 || npm install -g appium@latest
      - appium driver install uiautomator2
      - appium --version
      - devicefarm-cli use java 17
      - java -version

  pre_test:
    commands:
      # Classpath: test jar + todas las dependencias
      - export CLASSPATH=$CLASSPATH:$DEVICEFARM_TEST_PACKAGE_PATH/*
      - export CLASSPATH=$CLASSPATH:$DEVICEFARM_TEST_PACKAGE_PATH/dependency-jars/*
      # Appium 3: ya no soporta --default-capabilities, el cliente pasa las capabilities directamente
      - >
        appium --base-path=/wd/hub --log-timestamp
        --log-no-colors --relaxed-security
        >> $DEVICEFARM_LOG_DIR/appium.log 2>&1 &
      # Esperar a que Appium esté listo (máx 30 seg)
      - >
        appium_t=0;
        until curl --silent --fail "http://0.0.0.0:4723/wd/hub/status"; do
          if [[ $appium_t -gt 30 ]]; then echo "Appium no levantó a tiempo"; exit 1; fi;
          appium_t=$((appium_t+1)); sleep 1;
        done
      - echo "Appium listo en http://0.0.0.0:4723/wd/hub"

  test:
    commands:
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      # TEST_TAGS controla qué tests corren. Ejemplos:
      #   @login_mainframe or @own_transfer   → sprint actual
      #   @regression                         → toda la regresión
      #   @login_mainframe                    → solo login y home
      - export TEST_TAGS=${TEST_TAGS:-"@regression"}
      - >
        java
        -Dappium.screenshots.dir=$DEVICEFARM_SCREENSHOT_PATH
        -Dcucumber.filter.tags="$TEST_TAGS"
        -cp $CLASSPATH
        org.testng.TestNG
        -testjar *-tests.jar
        -d $DEVICEFARM_LOG_DIR/test-output
        -verbose 2

  post_test:
    commands:
      - echo "Tests finalizados"

artifacts:
  - $DEVICEFARM_LOG_DIR

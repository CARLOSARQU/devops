version: 0.1

android_test_host: amazon_linux_2

phases:
  install:
    commands:
      - devicefarm-cli use node 20
      - devicefarm-cli use appium 2
      - appium --version
      - export APPIUM_BASE_PATH=
      - devicefarm-cli use java 17
      - java -version

  pre_test:
    commands:
      # Classpath: test jar + todas las dependencias
      - export CLASSPATH=$CLASSPATH:$DEVICEFARM_TEST_PACKAGE_PATH/*
      - export CLASSPATH=$CLASSPATH:$DEVICEFARM_TEST_PACKAGE_PATH/dependency-jars/*
      # Arrancar Appium con las capabilities del dispositivo que Device Farm inyecta
      - >
        appium --base-path=$APPIUM_BASE_PATH --log-timestamp
        --log-no-colors --relaxed-security
        --default-capabilities
        "{\"appium:deviceName\": \"$DEVICEFARM_DEVICE_NAME\",
        \"platformName\": \"$DEVICEFARM_DEVICE_PLATFORM_NAME\",
        \"appium:udid\": \"$DEVICEFARM_DEVICE_UDID\",
        \"appium:platformVersion\": \"$DEVICEFARM_DEVICE_OS_VERSION\",
        \"appium:app\": \"$DEVICEFARM_APP_PATH\",
        \"appium:automationName\": \"UiAutomator2\",
        \"appium:chromedriverExecutableDir\": \"$DEVICEFARM_CHROMEDRIVER_EXECUTABLE_DIR\"}"
        >> $DEVICEFARM_LOG_DIR/appium.log 2>&1 &
      # Esperar a que Appium esté listo (máx 30 seg)
      - >
        appium_t=0;
        until curl --silent --fail "http://0.0.0.0:4723/status"; do
          if [[ $appium_t -gt 30 ]]; then echo "Appium no levantó a tiempo"; exit 1; fi;
          appium_t=$((appium_t+1)); sleep 1;
        done
      - echo "Appium listo en http://0.0.0.0:4723"

  test:
    commands:
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      - >
        java
        -Dappium.screenshots.dir=$DEVICEFARM_SCREENSHOT_PATH
        -cp $CLASSPATH
        org.testng.TestNG
        -testjar *-tests.jar
        -d $DEVICEFARM_LOG_DIR/test-output
        -verbose 2

  post_test:
    commands:
      - echo "Tests finalizados"

artifacts:
  - $DEVICEFARM_LOG_DIR
